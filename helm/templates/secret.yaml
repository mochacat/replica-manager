{{/*
  DEV-ONLY Secret renderer — NOT for production use.

  This template exists so local development and integration tests can stand up
  the server without external cert tooling. It packages the pre-generated dev
  certs from helm/certs/ (produced by `make certs` / `make helm-certs`) into a
  Secret.

  For production, do NOT ship key material in the chart. Create the Secret
  yourself (cert-manager, Vault, KMS, an internal CA, `kubectl create secret`,
  ...) and reference it via `.Values.certs.secretName`. This template is gated
  by `.Values.certs.create` (default false).
*/}}
{{- if .Values.certs.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.certs.secretName | default "replica-manager-certs" }}
  labels:
    app.kubernetes.io/name: replica-manager
type: Opaque
data:
  ca.pem: {{ .Files.Get "certs/ca.pem" | b64enc | quote }}
  server-public.pem: {{ .Files.Get "certs/server-public.pem" | b64enc | quote }}
  server-private.pem: {{ .Files.Get "certs/server-private.pem" | b64enc | quote }}
  client-public.pem: {{ .Files.Get "certs/client-public.pem" | b64enc | quote }}
  client-private.pem: {{ .Files.Get "certs/client-private.pem" | b64enc | quote }}
{{- end -}}