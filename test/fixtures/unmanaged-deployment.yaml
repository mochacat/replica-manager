apiVersion: apps/v1
kind: Deployment
metadata:
  name: unmanaged-test
  labels:
    app: unmanaged-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unmanaged-test
  template:
    metadata:
      labels:
        app: unmanaged-test
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10